    to: "appearance/themes/siyuan-graphite"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/siyuan-catppuccin-latte"
    to: "appearance/themes/siyuan-catppuccin-latte"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/siyuan-catppuccin-mocha"
    to: "appearance/themes/siyuan-catppuccin-mocha"
